<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=1.0, maximum-scale=3.0">
    <title>永伴 - 陪您聊天的智能伙伴</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 加载提示 -->
    <div id="loading" class="loading hidden">
        <div class="loading-spinner"></div>
        <p>请稍候...</p>
    </div>

    <!-- 登录页面 -->
    <div id="login-page" class="page">
        <div class="container">
            <div class="logo">
                <h1>永伴</h1>
                <p class="subtitle">陪您聊天的智能伙伴</p>
            </div>

            <div class="card">
                <h2 class="page-title">登录</h2>

                <div class="form-group">
                    <label for="login-phone">手机号</label>
                    <input type="tel" id="login-phone" class="input-large" placeholder="请输入手机号" maxlength="11">
                </div>

                <div class="form-group">
                    <label for="login-password">密码</label>
                    <input type="password" id="login-password" class="input-large" placeholder="请输入密码">
                </div>

                <button class="btn btn-primary btn-large" onclick="login()">登录</button>

                <div class="divider">
                    <span>还没有账号？</span>
                </div>

                <button class="btn btn-secondary btn-large" onclick="showRegister()">注册新账号</button>
            </div>

            <!-- 测试账号提示 -->
            <div class="test-account-hint">
                <p>测试账号：13800138000</p>
                <p>测试密码：password123</p>
            </div>
        </div>
    </div>

    <!-- 注册页面 -->
    <div id="register-page" class="page hidden">
        <div class="container">
            <div class="logo">
                <h1>永伴</h1>
                <p class="subtitle">注册新账号</p>
            </div>

            <div class="card">
                <h2 class="page-title">注册</h2>

                <div class="form-group">
                    <label for="register-phone">手机号</label>
                    <input type="tel" id="register-phone" class="input-large" placeholder="请输入手机号" maxlength="11">
                </div>

                <div class="form-group">
                    <label for="register-nickname">昵称</label>
                    <input type="text" id="register-nickname" class="input-large" placeholder="请输入昵称">
                </div>

                <div class="form-group">
                    <label for="register-password">密码</label>
                    <input type="password" id="register-password" class="input-large" placeholder="至少6位密码">
                </div>

                <div class="form-group">
                    <label for="register-password2">确认密码</label>
                    <input type="password" id="register-password2" class="input-large" placeholder="请再次输入密码">
                </div>

                <button class="btn btn-primary btn-large" onclick="register()">立即注册</button>

                <div class="divider">
                    <span>已有账号？</span>
                </div>

                <button class="btn btn-secondary btn-large" onclick="showLogin()">返回登录</button>
            </div>
        </div>
    </div>

    <!-- 角色列表页面 -->
    <div id="companions-page" class="page hidden">
        <div class="header">
            <h1>我的陪伴</h1>
            <button class="btn btn-logout" onclick="logout()">退出</button>
        </div>

        <div class="container">
            <div class="welcome-card">
                <h2>您好，<span id="user-nickname"></span>！</h2>
                <p class="welcome-text">选择一个陪伴角色开始聊天</p>
            </div>

            <div id="companions-list" class="companions-list">
                <!-- 角色卡片将动态插入这里 -->
            </div>

            <button class="btn btn-primary btn-large btn-create" onclick="showCreateCompanion()">
                ＋ 创建新的陪伴角色
            </button>
        </div>
    </div>

    <!-- 创建角色页面 -->
    <div id="create-companion-page" class="page hidden">
        <div class="header">
            <button class="btn btn-back" onclick="showCompanions()">← 返回</button>
            <h1>创建陪伴角色</h1>
        </div>

        <div class="container">
            <div class="card">
                <div class="form-group">
                    <label for="companion-name">角色名称</label>
                    <input type="text" id="companion-name" class="input-large" placeholder="例如：妈妈、老伴、老友">
                </div>

                <div class="form-group">
                    <label for="companion-relationship">角色关系</label>
                    <select id="companion-relationship" class="input-large">
                        <option value="parent">父母</option>
                        <option value="spouse">配偶</option>
                        <option value="friend">朋友</option>
                        <option value="child">子女</option>
                        <option value="grandparent">祖父母</option>
                        <option value="sibling">兄弟姐妹</option>
                        <option value="other">其他</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="companion-gender">性别</label>
                    <select id="companion-gender" class="input-large">
                        <option value="female">女性</option>
                        <option value="male">男性</option>
                        <option value="other">其他</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="companion-story">角色背景</label>
                    <textarea id="companion-story" class="input-large textarea-large" rows="4"
                        placeholder="描述一下这个角色的性格、习惯、特点等...&#10;例如：一位慈爱的母亲，生前最爱做饭，总是关心孩子的生活起居"></textarea>
                </div>

                <button class="btn btn-primary btn-large" onclick="createCompanion()">创建角色</button>
            </div>
        </div>
    </div>

    <!-- 对话页面 -->
    <div id="chat-page" class="page hidden">
        <div class="header">
            <button class="btn btn-back" onclick="showCompanions()">← 返回</button>
            <h1 id="chat-companion-name"></h1>
        </div>

        <div class="chat-container">
            <div id="chat-messages" class="chat-messages">
                <!-- 消息将动态插入这里 -->
            </div>

            <div class="chat-input-area">
                <textarea id="chat-input" class="chat-input" rows="2"
                    placeholder="输入您想说的话..."></textarea>
                <button class="btn btn-primary btn-send" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <!-- 提示框 -->
    <div id="toast" class="toast hidden"></div>

    <script src="js/app.js"></script>
</body>
</html>
