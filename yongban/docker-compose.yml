version: '3.8'

services:
  # PostgreSQL数据库
  db:
    image: postgres:15-alpine
    container_name: yongban-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yongban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yongban_password}
      POSTGRES_DB: ${POSTGRES_DB:-yongban}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yongban}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yongban-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: yongban-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yongban-network

  # Qdrant向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    container_name: yongban-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - yongban-network

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    container_name: yongban-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - yongban-network

  # FastAPI后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yongban-backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yongban-network
    restart: unless-stopped

  # Nginx前端服务
  frontend:
    image: nginx:alpine
    container_name: yongban-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    networks:
      - yongban-network
    restart: unless-stopped

  # Celery Worker（异步任务）
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yongban-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
      - backend
    networks:
      - yongban-network
    restart: unless-stopped

  # Celery Beat（定时任务）
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yongban-celery-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
      - backend
    networks:
      - yongban-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:

networks:
  yongban-network:
    driver: bridge
